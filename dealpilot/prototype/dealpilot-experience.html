<title>DealPilot Experience</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* DealPilot identity.
   Layout: a ledger, not a dashboard. Ruled rows, poster numerals, one inverted "next move" block per screen.
   System: SOLID means confirmed. HATCHED means not yet real (simulated, self-declared, projected). LIME marks the money move. */
:root {
  --bg: #F7F6F2; --paper: #FFFFFF; --ink: #101C29; --mute: #5A6470; --hair: #D8D5CA;
  --block: #101C29; --on-block: #F7F6F2; --block-mute: #9BA7B3;
  --lime: #C9F36A; --on-lime: #101C29; --bad: #B0341A; --bad-soft: #F6E3DD; --hatch: rgba(16,28,41,.5);
  --poster: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A131B; --paper: #101C29; --ink: #F2F1EC; --mute: #9BA7B3; --hair: #24323F;
  --block: #F2F1EC; --on-block: #101C29; --block-mute: #5A6470;
  --lime: #C9F36A; --on-lime: #101C29; --bad: #FF8E70; --bad-soft: #3A1A12; --hatch: rgba(242,241,236,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0A131B; --paper: #101C29; --ink: #F2F1EC; --mute: #9BA7B3; --hair: #24323F;
  --block: #F2F1EC; --on-block: #101C29; --block-mute: #5A6470;
  --lime: #C9F36A; --on-lime: #101C29; --bad: #FF8E70; --bad-soft: #3A1A12; --hatch: rgba(242,241,236,.5); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
p, h1, h2, h3, ul, ol { margin: 0; padding: 0 } li { list-style: none }
button, input, select, textarea { font: inherit; color: inherit } button { cursor: pointer }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }
.block :focus-visible { outline-color: var(--lime) }

/* Type */
.poster { font-family: var(--poster); font-stretch: 68%; font-weight: 800; text-transform: uppercase; line-height: .86; letter-spacing: -.01em; font-size: clamp(3.4rem, 17vw, 7.5rem); text-wrap: balance }
h1 { font-family: var(--poster); font-stretch: 78%; font-weight: 800; font-size: clamp(2rem, 8vw, 3.2rem); line-height: .96; letter-spacing: -.015em; text-wrap: balance }
h2 { font-family: var(--poster); font-stretch: 85%; font-weight: 700; font-size: 1.3rem; line-height: 1.1; text-wrap: balance }
.say { font-family: var(--poster); font-stretch: 88%; font-weight: 600; font-size: clamp(1.25rem, 4.6vw, 1.7rem); line-height: 1.16; letter-spacing: -.01em; text-wrap: pretty }
.fig { font-family: var(--poster); font-stretch: 66%; font-weight: 800; line-height: .9; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap }
.fig.xl { font-size: clamp(3.6rem, 18vw, 7rem) } .fig.l { font-size: clamp(2.4rem, 10vw, 3.6rem) } .fig.m { font-size: 1.9rem } .fig.s { font-size: 1.35rem }
.fig.hollow { color: transparent; -webkit-text-stroke: 1.5px var(--ink) }
.label { font-family: var(--mono); font-size: .68rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--mute) }
.mute { color: var(--mute) } .small { font-size: .88rem } .num { font-variant-numeric: tabular-nums }
.was { text-decoration: line-through; text-decoration-thickness: .08em; color: var(--mute) }
.hl { background: var(--lime); color: var(--on-lime); padding: 0 .14em; box-decoration-break: clone; -webkit-box-decoration-break: clone }
.sim { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.sim::before, .hatch { background-image: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 5px) }
.sim::before { content: ""; width: 12px; height: 12px; border: 1px solid currentColor; flex: none }
.ok-mark { font-family: var(--mono); font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.ok-mark::before { content: ""; width: 12px; height: 12px; background: var(--ink); flex: none }
svg.ar { width: .9em; height: .9em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; flex: none }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; flex: none }

/* Frame */
.gut { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1.5px solid var(--ink) }
.head-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 58px }
.wm { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 0; font-family: var(--poster); font-stretch: 112%; font-weight: 800; font-size: 1.12rem; letter-spacing: -.03em; text-transform: lowercase }
.wm i { width: 24px; height: 24px; background: var(--lime); color: var(--on-lime); display: grid; place-items: center; border: 1.5px solid var(--on-lime) }
.wm i svg { width: 13px; height: 13px; stroke-width: 2.6 }
.wm em { font-style: normal; font-stretch: 70%; font-weight: 500 }
.grow { flex: 1; min-width: 0 }
.who { display: flex; font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--ink) }
.who button { background: none; border: 0; padding: 8px 7px; min-height: 36px; color: var(--mute) }
.who { font-size: .62rem }
.block .sim::before { background-image: repeating-linear-gradient(135deg, var(--block-mute) 0 1.5px, transparent 1.5px 5px) }
.who button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.menu-b { background: none; border: 0; font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; padding: 10px 0; min-height: 44px; text-decoration: underline; text-underline-offset: 4px }
.topnav { display: none }
.proto { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding-block: 7px; max-width: 1040px; margin: 0 auto }
.main { max-width: 1040px; margin: 0 auto; padding-block: 18px 120px; display: flex; flex-direction: column; gap: 34px }
.narrow { max-width: 680px }
.nav { position: fixed; inset: auto 0 0; z-index: 20; background: var(--block); color: var(--on-block); display: flex; padding: 0 max(6px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-left, 0px)) }
.nav button { flex: 1; min-width: 0; background: none; border: 0; color: var(--block-mute); font-family: var(--mono); font-size: .68rem; letter-spacing: .07em; text-transform: uppercase; padding: 0 2px; min-height: 58px; border-top: 4px solid transparent }
.nav button[aria-current="page"] { color: var(--on-block); border-top-color: var(--lime) }
@media (min-width: 900px) {
  .nav { display: none } .main { padding-block: 28px 80px; gap: 44px }
  .topnav { display: flex; gap: 22px; margin-left: 14px }
  .topnav button { background: none; border: 0; padding: 0; min-height: 58px; font-weight: 600; font-size: .95rem; color: var(--mute); border-bottom: 4px solid transparent; border-top: 4px solid transparent }
  .topnav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--lime) }
  .split { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: start }
}
.split { display: grid; gap: 34px }
.stack { display: flex; flex-direction: column; gap: 14px } .stack.tight { gap: 6px } .stack.loose { gap: 24px }
.line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap } .line.base { align-items: baseline } .between { justify-content: space-between }
hr { border: 0; border-top: 1.5px solid var(--ink); margin: 0; width: 100% } hr.thin { border-top: 1px solid var(--hair) }

/* Controls */
.b { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 20px; background: transparent; border: 1.5px solid var(--ink); border-radius: 2px; font-weight: 600; text-align: center; transition: transform .08s }
.b:active { transform: translate(1px, 1px) }
.b.go { background: var(--lime); color: var(--on-lime); border-color: var(--on-lime); font-weight: 700 }
.b.solid { background: var(--ink); color: var(--bg) }
.b.wide { width: 100% } .b.sm { min-height: 42px; padding: 0 14px; font-size: .9rem }
.b.bad { border-color: var(--bad); color: var(--bad) }
.t { background: none; border: 0; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; min-height: 32px; display: inline-flex; align-items: center; gap: 6px }
.block { background: var(--block); color: var(--on-block); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px }
.block .label, .block .mute { color: var(--block-mute) }
.block .b { border-color: var(--on-block) } .block .b.go { border-color: var(--lime) } .block .b.bad { border-color: var(--block-mute); color: var(--on-block) }
.block .in { background: transparent; border-color: var(--block-mute); color: var(--on-block) } .block .in:focus { border-color: var(--lime) }
.block hr { border-color: var(--block-mute) }
.f { display: flex; flex-direction: column; gap: 6px } .f label { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute) } .block .f label { color: var(--block-mute) }
.in { width: 100%; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px; padding: 12px; min-height: 50px }
.in:focus { outline: none; box-shadow: inset 0 -4px 0 var(--lime) }
textarea.in { line-height: 1.45; resize: vertical }
.tick { display: flex; gap: 12px; align-items: flex-start; font-size: .94rem }
.tick input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border: 1.5px solid currentColor; background: transparent; flex: none; margin: 0; display: grid; place-items: center }
.tick input:checked { background: var(--lime); border-color: var(--on-lime) }
.tick input:checked::after { content: ""; width: 11px; height: 6px; border: solid var(--on-lime); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px) }
.err { border: 1.5px solid var(--bad); color: var(--bad); background: var(--bad-soft); padding: 10px 12px; font-weight: 600; font-size: .92rem }
.block .err { background: transparent; color: #FFB29E; border-color: #FFB29E }
.aside { border-left: 4px solid var(--ink); padding: 2px 0 2px 14px; font-size: .92rem; color: var(--mute) } .aside b { color: var(--ink) }
.block .aside { border-left-color: var(--lime); color: var(--block-mute) } .block .aside b { color: var(--on-block) }

/* Ledger rows */
.rows > * { border-top: 1px solid var(--hair) } .rows > :first-child { border-top: 1.5px solid var(--ink) } .rows > :last-child { border-bottom: 1.5px solid var(--ink) }
.r { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; width: 100%; padding: 16px 0; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; position: relative }
button.r:hover { background: linear-gradient(90deg, var(--lime), var(--lime)) no-repeat left / 6px 100% ; padding-left: 16px } button.r { transition: padding .15s }
.r .ix { font-family: var(--mono); font-size: .7rem; color: var(--mute); align-self: start; padding-top: 5px; min-width: 22px }
.r .go-t { grid-column: 2 / -1; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px }
.r .ttl { font-family: var(--poster); font-stretch: 86%; font-weight: 700; font-size: 1.14rem; line-height: 1.15 }

/* Home */
.ask { display: flex; border: 2px solid var(--ink); background: var(--paper) }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 14px; min-height: 62px; font-size: 1.08rem; outline: none }
.ask button { border: 0; border-left: 2px solid var(--ink); background: var(--lime); color: var(--on-lime); width: 68px; display: grid; place-items: center; font-size: 1.5rem }
.ask:focus-within { box-shadow: 6px 6px 0 var(--ink) }
.try { line-height: 2 } .try .t { font-weight: 500 }
.how { counter-reset: h; display: grid; gap: 0 } .how li { counter-increment: h; display: grid; grid-template-columns: 3.2rem minmax(0, 1fr); align-items: baseline; padding: 14px 0; border-top: 1px solid var(--hair) }
.how li::before { content: "0" counter(h); font-family: var(--poster); font-stretch: 66%; font-weight: 800; font-size: 1.9rem; line-height: 1 }

/* Price ladder */
.ladder { position: relative; height: 112px; margin: 0 2px }
.ladder .track { position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid var(--ink) }
.ladder .track::before, .ladder .track::after { content: ""; position: absolute; top: -6px; height: 11px; border-left: 1.5px solid var(--ink) } .ladder .track::after { right: 0 }
.ladder .fill { position: absolute; top: calc(50% - 5px); height: 10px; right: 0 }
.mk { position: absolute; top: 50%; width: 0 }
.mk i { position: absolute; left: -1px; top: -13px; width: 2px; height: 26px; background: var(--ink) }
.mk.offer i { left: -9px; top: -9px; width: 18px; height: 18px; background: var(--lime); border: 1.5px solid var(--ink); transform: rotate(45deg) }
.mk.ask i { left: -7px; top: -7px; width: 14px; height: 14px; background: var(--bg); border: 1.5px solid var(--ink) }
.mk.target i { background: none; border-left: 2px dashed var(--mute); height: 34px; top: -17px }
.mk.risk i { left: -9px; top: -9px; width: 18px; height: 18px; background: var(--bg); border: 1.5px solid var(--bad); transform: rotate(45deg) }
.mk.pt i { left: -9px; top: -9px; width: 18px; height: 18px; background: var(--ink); transform: rotate(45deg) }
.mk span { position: absolute; white-space: nowrap; font-family: var(--mono); font-size: .68rem; line-height: 1.3; font-variant-numeric: tabular-nums }
.mk span b { display: block; font-weight: 500; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; font-size: .6rem }
.mk.up span { bottom: 20px } .mk.dn span { top: 20px }
.mk.al-c span { transform: translateX(-50%); text-align: center } .mk.al-l span { left: -4px } .mk.al-r span { right: -2px; text-align: right }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end } .trio > div { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.path { display: flex; gap: 0 } .path li { flex: 1; font-family: var(--mono); font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); border-top: 4px solid var(--hair); padding-top: 6px }
.path li.done { border-top-color: var(--ink); color: var(--ink) } .path li.now { border-top-color: var(--lime); color: var(--ink); font-weight: 700 }

/* Exchange log */
.log > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 0; border-top: 1px solid var(--hair); animation: in .35s both }
.log > li p { grid-column: 1 / -1; white-space: pre-wrap; font-size: .96rem }
.log > li.note p { color: var(--mute) } .log > li.sys { display: block; font-family: var(--mono); font-size: .7rem; color: var(--mute); text-transform: uppercase; letter-spacing: .05em }
.log > li.them { border-left: 4px solid var(--ink); padding-left: 12px } .log > li.you { border-left: 4px solid var(--lime); padding-left: 12px }
@keyframes in { from { opacity: 0; transform: translateY(8px) } }
.wait i { display: inline-block; width: 8px; height: 8px; background: var(--lime); margin-right: 5px; animation: hop 1s infinite } .wait i:nth-child(2) { animation-delay: .15s } .wait i:nth-child(3) { animation-delay: .3s }
@keyframes hop { 0%, 70%, 100% { transform: none; opacity: .4 } 35% { transform: translateY(-6px); opacity: 1 } }
.dial { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--ink) }
.dial button { background: none; border: 0; border-left: 1.5px solid var(--ink); padding: 10px 6px; min-height: 50px; font-weight: 600; font-size: .86rem } .dial button:first-child { border-left: 0 }
.dial button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

/* Offer slips */
.slip { border-top: 1.5px solid var(--ink); padding: 20px 0 6px; display: grid; gap: 14px; animation: in .4s both }
.slip.off { opacity: .45 }
.slip-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 12px; align-items: center }
.slip .lt { font-family: var(--poster); font-stretch: 66%; font-weight: 800; font-size: 2.6rem; line-height: .85; width: 1.1em }
.cover { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--ink) }
.cover div { padding: 8px 8px 10px; border-left: 1.5px solid var(--ink); min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: .78rem; line-height: 1.25 } .cover div:first-child { border-left: 0 }
.cover b { font-family: var(--mono); font-size: .58rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 500 }
.cover .full { background: var(--ink); color: var(--bg) } .cover .none { color: var(--bad); background: var(--bad-soft) }
.tw { overflow-x: auto; border: 1.5px solid var(--ink) } table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: .9rem; background: var(--paper) }
th, td { text-align: left; padding: 11px 12px; border-top: 1px solid var(--hair); vertical-align: top } thead th { border-top: 0; font-family: var(--mono); font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 500 }
td.no { color: var(--bad); font-weight: 700 } td.yes { font-weight: 700 }
.viewsw { display: flex; gap: 16px } .viewsw button { background: none; border: 0; padding: 4px 0; min-height: 40px; font-weight: 600; color: var(--mute); border-bottom: 3px solid transparent } .viewsw button[aria-pressed="true"], .viewsw button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lime) }
.viewsw { overflow-x: auto; white-space: nowrap }

/* Find flow */
.sheet-doc { background: var(--paper); border: 1.5px solid var(--ink); padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; position: relative }
.sheet-doc .in { border-width: 0 0 1.5px 0; padding: 6px 0; min-height: 40px; background: transparent; font-weight: 600 }
.drop { border: 2px dashed var(--ink); padding: 34px 18px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; transition: background .15s }
.drop.over { background: var(--lime); color: var(--on-lime) }
.prog { height: 4px; background: var(--hair) } .prog i { display: block; height: 100%; background: var(--ink); transition: width .4s }
.scan li { font-family: var(--mono); font-size: .8rem; padding: 8px 0; border-top: 1px solid var(--hair); opacity: .3; animation: lit .3s forwards } .scan li:nth-child(2) { animation-delay: .5s } .scan li:nth-child(3) { animation-delay: 1s } .scan li:nth-child(4) { animation-delay: 1.5s }
@keyframes lit { to { opacity: 1 } }

/* Group stairs */
.stairs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 0; border-bottom: 1.5px solid var(--ink) }
.stairs div { border: 1.5px solid var(--ink); border-bottom: 0; margin-left: -1.5px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 4px; justify-content: flex-end; min-width: 0 } .stairs div:first-child { margin-left: 0 }
.stairs .s1 { height: 190px } .stairs .s2 { height: 150px } .stairs .s3 { height: 116px }
.stairs .on { background: var(--lime); color: var(--on-lime) } .stairs .on .label { color: var(--on-lime) }
.dots { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px } .dots i { aspect-ratio: 1; border: 1.5px solid var(--ink) } .dots i.m { background: var(--ink) } .dots i.me { background: var(--lime) } .dots i.gate { margin-right: 6px }

/* Docket */
.docket { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); padding: 22px 18px 18px; font-family: var(--mono); font-size: .84rem; position: relative; animation: print .5s both cubic-bezier(.2, .8, .2, 1) }
.docket::after { content: ""; position: absolute; left: -1.5px; right: -1.5px; bottom: -9px; height: 9px; background: linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0 / 12px 9px, linear-gradient(225deg, var(--paper) 50%, transparent 50%) 0 0 / 12px 9px }
.docket .ln { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0 } .docket .cut { border-top: 1.5px dashed var(--ink); margin: 8px 0 }
.docket .net { background: var(--lime); color: var(--on-lime); margin: 6px -18px 0; padding: 12px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 700 }

    if (!(price > 0) || price >= n.offer) return fail(`A counteroffer must be lower than your current offer of ${fmt(n.offer)}.`);
    if (price <= n.ask) return fail(`That's at or below the customer's ask of ${fmt(n.ask)}. Accept it instead.`);
    if (!checked("n-ok")) return fail("Tick the box to approve this response.");
    n.msgs.push({ from: "you", text: msg || `We can offer ${fmt(price)}.`, amt: price }); n.offer = price; n.draft = null; n.sent++; n.state = "sent"; S.ui.err = null; toast("Counteroffer sent"); render();
    later(() => {
      if (price <= 4800 && n.sent > 1) { n.msgs.push({ from: "them", text: `${fmt(price)} works. I approve those terms.` }); n.terms = price; n.state = "final"; later(() => bizWin(), 900); }
      else { const ask = Math.min(price - 25, Math.max(n.ask, 4725)); n.ask = ask; n.msgs.push({ from: "them", text: `Thanks. I can commit today at ${fmt(ask)}. If that works, please confirm.` }); n.state = "asked"; toast("The customer replied"); }
    }, 1500);
  },
  negAccept() { const n = S.biz.neg; n.msgs.push({ from: "you", text: `Accepted ${fmt(n.ask)}.` }); n.terms = n.ask; n.offer = n.ask; n.state = "final"; toast("Accepted. Waiting for the customer to approve final terms."); render(); later(() => bizWin(), 1500); },
  negDecline() { S.biz.neg.state = "declined"; toast("Negotiation declined"); render(); },
  tiersPublish() {
    const t = [{ min: num(val("t1m")), price: num(val("t1p")) }, { min: num(val("t2m")), price: num(val("t2p")) }];
    if (t.some((x) => !(x.min >= 2) || !(x.price > 0))) return fail("Each tier needs at least 2 households and a price.");
    if (t[1].min <= t[0].min || t[1].price >= t[0].price) return fail("The larger tier must need more households and cost less.");
    if (t.some((x) => x.price >= 3000)) return fail("Every tier must be below the typical price of $3,000.");
    if (!checked("t-ok")) return fail("Tick the box to approve this volume offer.");
    S.biz.tiers = t; S.ui.err = null; toast("Tiers published to the group"); render();
  },
  tiersEdit() { S.biz.tiers = null; render(); },
};
function bizWin() { const n = S.biz.neg; n.state = "won"; n.msgs.push({ from: "sys", text: "The customer approved the final terms. Both parties have approved." }); const r = S.biz.reqs[0]; r.bid = { price: n.terms, status: "Won" }; if (!S.biz.won.some((w) => w.id === "b1")) S.biz.won.unshift({ id: "b1", title: r.title, price: n.terms }); if (S.portal === "business") toast("Job won"); }
function analyse(name, sample) {
  const f = S.find; f.file = name; f.busy = true; f.sample = sample; render();
  later(() => { f.busy = false; f.ex = JSON.parse(JSON.stringify(SAMPLE[f.cat])); f.step = 3; if (!sample) toast("Showing a sample extraction for you to edit"); }, 2100);
}

// ───────────────────────── home question ─────────────────────────
document.addEventListener("submit", (e) => {
  if (e.target.dataset.form !== "ask") return;
  e.preventDefault();
  const q = val("askq").toLowerCase().trim();
  if (!q) { S.find = { step: 1, cat: null, file: null, busy: false, ex: null, sample: false }; return go("find"); }
  const hit = KEYS.find((k) => k[1].test(q)); const cat = hit ? hit[0] : "other";
  A.startFind(cat); toast(hit ? "Filed under " + CATS.find((c) => c.id === cat).name.toLowerCase() : "We'll treat that as a custom request");
});
// ───────────────────────── refinements ─────────────────────────
A.findKind = (v) => { S.find = { step: 1, cat: null, file: null, busy: false, ex: null, sample: false, kind: v || null }; go("find"); };
function bizSave() { const d = S.ui.bizDraft || (S.ui.bizDraft = {}); [["price", "b-price"], ["days", "b-days"], ["scope", "b-scope"], ["mat", "b-mat"], ["war", "b-war"]].forEach(([k, id]) => { const el = document.getElementById(id); if (el) d[k] = el.value.trim(); }); return d; }
A.bizOpen = (v) => { S.ui.bizReq = v; S.ui.bizDraft = {}; S.ui.bizStep = 1; S.ui.err = null; render(); window.scrollTo(0, 0); };
A.bizAI = () => { const r = S.biz.reqs.find((x) => x.id === S.ui.bizReq); S.ui.bizDraft = { price: String(Math.round((r.quote * 0.92) / 50) * 50), days: "10", scope: r.title + ". " + r.details.join(". ") + ".", mat: "To Australian Standards, as specified", war: "84", ai: true }; S.ui.err = null; toast("AI draft ready for your review"); render(); };
A.bizNext = () => { const d = bizSave(); const st = S.ui.bizStep || 1;
  if (st === 1) { if (!(num(d.price) > 0)) return fail("Enter your total price."); if (!(num(d.days) > 0)) return fail("Enter how many days the job will take."); }
  if (st === 2 && !d.scope) return fail("Describe the scope of work.");
  S.ui.bizStep = st + 1; S.ui.err = null; render(); };
A.bizPrev = () => { bizSave(); S.ui.bizStep = Math.max(1, (S.ui.bizStep || 1) - 1); S.ui.err = null; render(); };
A.bizSubmit = () => { const r = S.biz.reqs.find((x) => x.id === S.ui.bizReq); const d = S.ui.bizDraft || {};
  if (!checked("b-ok")) return fail("Tick the box to confirm a person at your business approves this offer.");
  r.bid = { price: num(d.price), status: "Submitted" }; S.ui.bizDraft = null; S.ui.bizStep = 1; S.ui.err = null; toast("Bid submitted to the customer"); render(); };
// ───────────────────────── events ─────────────────────────
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "backdrop" && e.target !== el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset.v, e);
});
document.addEventListener("change", (e) => { if (e.target.id === "file" && e.target.files[0]) analyse(e.target.files[0].name, false); });
document.addEventListener("dragover", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file) analyse(file.name, false); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.ui.modal) A.close(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== route) { route = h; if (h.startsWith("biz")) S.portal = "business"; render(); } });
const h0 = location.hash.slice(1); if (VIEWS[h0] && !["deal"].includes(h0)) { route = h0; if (h0.startsWith("biz")) S.portal = "business"; }
render();
})();
</script>
