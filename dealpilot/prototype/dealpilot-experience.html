  if (type === "claim") body = `<h2>Claim $50 back</h2><ol style="margin:0;padding-left:20px"><li>Find your receipt from Demo Electronics.</li><li>Ask for a price adjustment under their 30-day policy, in store or online.</li><li>Come back and confirm the refund amount.</li></ol><p class="muted small">Policies differ by retailer. DealPilot doesn't contact the retailer for you in this flow.</p><div class="row"><button class="btn primary grow" data-act="claimDone">I've requested it</button><button class="btn ghost" data-act="close">Not now</button></div>`;

// ───────────────────────── actions ─────────────────────────
const A = {
  go: (v) => go(v),
  portal(v) { S.portal = v; go(v === "business" ? "biz" : "dashboard"); toast(v === "business" ? "Business portal: Ben's Fencing & Gates" : "Customer portal"); },
  modal(v) { S.ui.modal = v; S.ui.err = null; if (v.startsWith("receipt")) S.ui.sawReceipt = true; render(); },
  close() { S.ui.modal = null; S.ui.err = null; render(); },
  backdrop(v, e) { if (e.target.classList.contains("overlay")) A.close(); },
  reset() { S = fresh(); toast("Demo reset"); go("welcome"); },
  actGo(v) { if (deal(v)) return A.openDeal(v); go(v); },
  // find
  startFind(v) { S.find = { step: 2, cat: v, file: null, busy: false, ex: null, sample: false }; go("find"); },
  findStep(v) { S.find.step = Number(v); S.ui.err = null; render(); },
  pickCat(v) { S.find.cat = v; S.find.step = 2; render(); },
  useSample() { analyse(S.find.cat === "trades" ? "fencing-quote-sample.pdf" : "sample-" + S.find.cat + ".pdf", true); },
  confirmEx() {
    const amount = num(val("ex-amount"));
    if (!(amount > 0)) return fail("Enter the quoted amount as a number, for example 5500.");
    if (!val("ex-provider").trim()) return fail("Add the provider's name.");
    const lines = (id) => val(id).split("\n").map((x) => x.trim()).filter(Boolean);
    Object.assign(S.find.ex, { provider: val("ex-provider").trim(), amount, per: val("ex-per"), title: val("ex-title").trim() || "My request", scope: val("ex-scope").trim(), inc: lines("ex-inc"), exc: lines("ex-exc"), cond: lines("ex-cond") });
    S.find.step = 4; S.ui.err = null; toast("Details confirmed"); render();
  },
  findPath(v) {
    const f = S.find, e = f.ex; const fence = f.cat === "trades" && f.sample && e.amount === 5500;
    if (v === "offers") {
      const id = fence ? "fence" : "r" + ++uid;
      S.requests = S.requests.filter((r) => r.id !== id); if (fence) S.deals = S.deals.filter((d) => d.reqId !== "fence");
      S.requests.unshift({ id, cat: f.cat, status: "inviting", ...e, offers: fence ? FENCE_OFFERS() : genericOffers(e.amount) });
      S.ui.reqId = id; S.ui.oview = "cards"; go("offers");
      later(() => { req(id).status = "offers"; log(`3 offers arrived for ${e.title}`, "Compare them now", "offers"); toast("3 offers have arrived"); }, 1800);
    } else {
      const d = newDeal({ title: e.title, party: e.provider.replace(/\s*\(fictional\)/, ""), simulated: true, was: e.amount, per: e.per, offer: e.amount, target: Math.round(e.amount * 0.8), floor: Math.round(e.amount * 0.88), cat: f.cat });
      d.msgs.push({ from: "ai", text: `You pay ${fmt(e.amount)}${perL(e.per)} with ${d.party}. Based on the details you confirmed, I suggest a target of ${fmt(d.target)}${perL(e.per)}. You can change it.` });
      S.ui.dealId = d.id; go("deal");
    }
    S.find = { step: 1, cat: null, file: null, busy: false, ex: null, sample: false };
  },
  // offers
  pickReq(v) { S.ui.reqId = v; go("offers"); },
  oview(v) { S.ui.oview = v; render(); },
  toggle(v) { S.ui.open[v] = !S.ui.open[v]; render(); },
  decline(v) { req(S.ui.reqId).offers.find((o) => o.id === v).declined = true; toast("Offer declined"); render(); },
  undecline(v) { req(S.ui.reqId).offers.find((o) => o.id === v).declined = false; render(); },
  askBetter(v) {
    const r = req(S.ui.reqId), o = r.offers.find((x) => x.id === v);
    const d = newDeal({ reqId: r.id, offerId: o.id, title: r.id === "fence" ? "Fence replacement" : r.title, party: o.biz, simulated: o.simulated, was: r.amount, per: r.per, offer: o.price, target: Math.round((o.price * 0.9) / 100) * 100 || Math.round(o.price * 0.9), floor: o.floor });
    d.msgs.push({ from: "ai", text: `${o.biz} offered ${fmt(o.price)} against your ${fmt(r.amount)} quote. Other offers go lower, which gives you leverage. I suggest asking for ${fmt(d.target)}.` });
    S.ui.dealId = d.id; go("deal");
  },
  acceptOffer(v) {
    if (!checked("okAccept")) return fail("Tick the box to confirm you accept this offer.");
    const r = req(S.ui.reqId), o = r.offers.find((x) => x.id === v);
    const d = newDeal({ reqId: r.id, offerId: o.id, title: r.id === "fence" ? "Fence replacement" : r.title, party: o.biz, simulated: o.simulated, was: r.amount, per: r.per, offer: o.price, target: o.price, floor: o.floor });
    S.ui.dealId = d.id; go("deal"); acceptCounter(d); render();
  },
  // deals
  openDeal(v) { S.ui.dealId = v; go("deal"); },
  mode(v) { const d = deal(S.ui.dealId); d.mode = v; S.mode = v; if (d.state === "draft" && v === "autopilot") { d.draft = null; d.state = d.asks ? "countered" : "open"; } toast(MODES[v][0] + " mode"); render(); },
  saveLimit() { const n = num(val("limit")); if (!(n > 0)) return toast("Enter a limit as a number", true); deal(S.ui.dealId).limit = n; toast("Autopilot limit saved"); render(); },
  draft() {
    const d = deal(S.ui.dealId);
    if (d.state === "open") { const t = num(val("target")); if (!(t > 0) || t >= d.offer) return fail(`Your target must be below ${fmt(d.offer)}.`); d.target = t; }
    S.ui.err = null;
    if (d.mode === "autopilot") return A.autopilot();
    makeDraft(d); render();
  },
  autopilot() {
    const d = deal(S.ui.dealId); const amt = suggest(d);
    if (d.asks > 0 && amt >= d.offer - 1) { d.msgs.push({ from: "ai", text: `Autopilot proposes accepting ${fmt(d.offer)}${perS(d.per)}. Only you can approve the final terms.`, tag: "Limited Autopilot" }); d.terms = { price: d.offer, you: false, them: true, by: "ai" }; d.state = "final"; return render(); }
    if (amt > d.limit) { d.msgs.push({ from: "ai", text: `Autopilot paused: ${fmt(amt)} is above your limit of ${fmt(d.limit)}. Here's a draft for your approval instead.`, tag: "Limited Autopilot" }); makeDraft(d); d.mode = "approval"; return render(); }
    sendAsk(d, amt, draftText(d.party, d.was, d.offer, amt, d.per, d.asks === 0), "Sent by Limited Autopilot · simulation"); toast("Autopilot sent a counteroffer (simulation)"); render();
  },
  send() {
    const d = deal(S.ui.dealId); const amt = num(val("amt")); const text = val("body").trim();
    if (!(amt > 0) || amt >= d.offer) return fail(`Ask for less than their current ${fmt(d.offer)}${perS(d.per)}.`);
    if (!text) return fail("The message can't be empty.");
    if (!checked("ok")) return fail("Tick the box to approve sending this message.");
    S.ui.err = null; sendAsk(d, amt, text); toast("Approved and sent"); render();
  },
  sentMyself() { const d = deal(S.ui.dealId); sendAsk(d, d.draft.amt, val("body").trim() || d.draft.text, "Sent by you"); render(); },
  copy() { const t = val("body"); const done = () => toast("Message copied"); if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(() => { document.getElementById("body").select(); toast("Select and copy the text"); }); else { document.getElementById("body").select(); toast("Select and copy the text"); } },
  discard() { const d = deal(S.ui.dealId); d.draft = null; d.state = d.asks ? "countered" : "open"; S.ui.err = null; render(); },
  acceptCounter() { acceptCounter(deal(S.ui.dealId)); render(); },
  approveTerms() { const d = deal(S.ui.dealId); if (!checked("okTerms")) return fail("Tick the box to approve the final terms."); S.ui.err = null; d.terms.you = true; d.msgs.push({ from: "you", text: `I approve the final terms: ${fmt(d.terms.price)}${perS(d.per)}.` }); finalise(d); render(); },
  walk() { const d = deal(S.ui.dealId); d.state = "ended"; d.draft = null; d.msgs.push({ from: "sys", text: "You ended this negotiation. No fee applies." }); if (d.reqId && req(d.reqId)) req(d.reqId).status = "offers"; toast("Negotiation ended. No fee."); render(); },
  doVerify(v) {
    const d = deal(v); const final = num(val("final"));
    if (!(final > 0)) return fail("Enter the final amount as a number.");
    if (!checked("okVerify")) return fail("Tick the box to confirm the deal was completed.");
    const t = verify(d, r2(final)); S.ui.err = null; S.ui.modal = "receipt:" + t.id; S.ui.sawReceipt = true; toast(t.saving > 0 ? `Saving verified: ${fmt(t.saving)}` : "Recorded. No saving, so no fee."); render();
  },
  // guardian
  gtab(v) { S.ui.gtab = v; if (route !== "guardian") return go("guardian"); render(); },
  gdismiss(v) { S.guard.gone[v] = true; S.ui.modal = null; toast("Marked as checked"); render(); },
  gneg(v) {
    const defs = { power: ["Electricity bill", "Demo Energy Retailer", 236, "mo"], stream: ["StreamFlix Premium", "StreamFlix", 24.99, "mo"], gym: ["Gym membership", "FitLife Gym", 64.95, "mo"], cloud: ["Cloud storage", "CloudBox", 4.49, "mo"], car: ["Car insurance renewal", "Demo Insurer", 1420, "yr"] };
    let d = S.deals.find((x) => x.key === v && active(x));
    if (!d) { const x = defs[v]; const rnd = (n) => (x[2] > 50 ? Math.round(n) : r2(n));
      d = newDeal({ key: v, title: x[0], party: x[1], simulated: true, was: x[2], per: x[3], offer: x[2], target: rnd(x[2] * 0.8), floor: rnd(x[2] * 0.88) });
      d.msgs.push({ from: "ai", text: `You pay ${fmt(x[2])}${perL(x[3])} with ${x[1]}. I suggest a target of ${fmt(d.target)}${perL(x[3])}.` }); }
    S.ui.dealId = d.id; go("deal");
  },
  checkPrice() { S.guard.checked = true; log("Price drop: headphones now $399", "You paid $449", "guardian"); toast("Price dropped to $399"); render(); },
  claimDone() {
    S.guard.claimed = true; S.ui.modal = null;
    S.deals.unshift({ id: "phones", key: "phones", title: "Headphones price adjustment", party: "Demo Electronics", simulated: true, was: 449, per: "", offer: 399, target: 399, floor: 399, mode: "advisory", limit: 0, state: "agreed", asks: 0, draft: null, terms: { price: 399, you: true, them: true, by: "you" }, msgs: [{ from: "ai", text: "Ask Demo Electronics for a $50 price adjustment with your receipt. Once refunded, confirm the amount." }] });
    log("Price adjustment requested", "Confirm the refund when it arrives", "savings"); toast("Claim recorded. Confirm the refund in Savings."); go("savings");
  },
  // group
  join() { S.group.joined = true; log("You joined the solar group buy", "5 members: $6,600 unlocked", "group"); toast("You're in. $6,600 unlocked for everyone."); render(); },
  leave() { S.group.joined = false; S.ui.err = null; toast("You left the group"); render(); },
  grow() { S.group.extra += 5; toast("5 simulated neighbours joined. $6,100 unlocked."); render(); },
  takeGroup() {
    if (!checked("okGroup")) return fail("Tick the box to take up the group price.");
    const p = groupPrice(); S.group.taken = true; S.ui.err = null;
    S.deals.unshift({ id: "solar", key: "solar", title: "Rooftop solar, group price", party: "SunPeak Solar", simulated: true, was: 7500, per: "", offer: p, target: p, floor: p, mode: "approval", limit: 0, state: "agreed", asks: 0, draft: null, terms: { price: p, you: true, them: true, by: "you" }, msgs: [{ from: "sys", text: `You took up the group price of ${fmt(p)}. SunPeak pre-approved these terms when it published the offer (simulated).` }] });
    log(`Group price taken up: ${fmt(p)}`, "Non-binding", "group"); toast("Group price taken up. Non-binding."); render();
  },
  // journeys
  journey(v) { const j = J.find((x) => x.n === Number(v)); S.ui.journey = j.n; j.start(); toast(`Journey ${j.n} started`); },
  exitJourney() { S.ui.journey = null; render(); },
  coachGo(v) { if (v === "deal") { const j = S.ui.journey; S.ui.dealId = j === 2 ? "internet" : j === 6 ? "fence6" : S.ui.dealId; } if (v === "offers") S.ui.reqId = "fence"; if (v.startsWith("biz")) S.portal = "business"; go(v); },
  // business
  bizOpen(v) { S.ui.bizReq = v; S.ui.bizDraft = null; S.ui.err = null; render(); window.scrollTo(0, 0); },
  bizBack() { S.ui.bizReq = null; S.ui.bizDraft = null; S.ui.err = null; render(); },
  bizAI() { const r = S.biz.reqs.find((x) => x.id === S.ui.bizReq); S.ui.bizDraft = { price: Math.round((r.quote * 0.92) / 50) * 50, days: 10, scope: r.title + ". " + r.details.join(". ") + ".", mat: "To Australian Standards, as specified", war: 84 }; S.ui.err = null; toast("AI draft ready for your review"); render(); },
  bizSubmit() {
    const r = S.biz.reqs.find((x) => x.id === S.ui.bizReq); const price = num(val("b-price"));
    if (!(price > 0)) return fail("Enter your total price.");
    if (!val("b-scope").trim()) return fail("Describe the scope of work.");
    if (!checked("b-ok")) return fail("Tick the box to confirm a person at your business approves this offer.");
    r.bid = { price, status: "Submitted" }; S.ui.bizDraft = null; S.ui.err = null; toast("Bid submitted to the customer"); render();
  },
  negDraft() {
    const n = S.biz.neg; const floor = num(val("n-floor"));
    if (!(floor > 0) || floor >= n.offer) return fail(`Enter a floor below your current offer of ${fmt(n.offer)}.`);
    const price = Math.max(floor, Math.round((n.ask + n.offer) / 2));
    n.draft = { price, msg: `Thanks for the request. We can't go to ${fmt(n.ask)}, but we can do ${fmt(price)} with the same scope and 7-year warranty if you confirm this week.` }; S.ui.err = null; render();
  },
  negDiscard() { S.biz.neg.draft = null; S.ui.err = null; toast("Draft rejected"); render(); },
  negSend() {
    const n = S.biz.neg; const price = num(val("n-price")); const msg = val("n-msg").trim();
    if (!(price > 0) || price >= n.offer) return fail(`A counteroffer must be lower than your current offer of ${fmt(n.offer)}.`);
    if (price <= n.ask) return fail(`That's at or below the customer's ask of ${fmt(n.ask)}. Accept it instead.`);
    if (!checked("n-ok")) return fail("Tick the box to approve this response.");
    n.msgs.push({ from: "you", text: msg || `We can offer ${fmt(price)}.`, amt: price }); n.offer = price; n.draft = null; n.sent++; n.state = "sent"; S.ui.err = null; toast("Counteroffer sent"); render();
    later(() => {
      if (price <= 4800 && n.sent > 1) { n.msgs.push({ from: "them", text: `${fmt(price)} works. I approve those terms.` }); n.terms = price; n.state = "final"; later(() => bizWin(), 900); }
      else { const ask = Math.min(price - 25, Math.max(n.ask, 4725)); n.ask = ask; n.msgs.push({ from: "them", text: `Thanks. I can commit today at ${fmt(ask)}. If that works, please confirm.` }); n.state = "asked"; toast("The customer replied"); }
    }, 1500);
  },
  negAccept() { const n = S.biz.neg; n.msgs.push({ from: "you", text: `Accepted ${fmt(n.ask)}.` }); n.terms = n.ask; n.offer = n.ask; n.state = "final"; toast("Accepted. Waiting for the customer to approve final terms."); render(); later(() => bizWin(), 1500); },
  negDecline() { S.biz.neg.state = "declined"; toast("Negotiation declined"); render(); },
  tiersPublish() {
    const t = [{ min: num(val("t1m")), price: num(val("t1p")) }, { min: num(val("t2m")), price: num(val("t2p")) }];
    if (t.some((x) => !(x.min >= 2) || !(x.price > 0))) return fail("Each tier needs at least 2 households and a price.");
    if (t[1].min <= t[0].min || t[1].price >= t[0].price) return fail("The larger tier must need more households and cost less.");
    if (t.some((x) => x.price >= 3000)) return fail("Every tier must be below the typical price of $3,000.");
    if (!checked("t-ok")) return fail("Tick the box to approve this volume offer.");
    S.biz.tiers = t; S.ui.err = null; toast("Tiers published to the group"); render();
  },
  tiersEdit() { S.biz.tiers = null; render(); },
};
function bizWin() { const n = S.biz.neg; n.state = "won"; n.msgs.push({ from: "sys", text: "The customer approved the final terms. Both parties have approved." }); const r = S.biz.reqs[0]; r.bid = { price: n.terms, status: "Won" }; if (!S.biz.won.some((w) => w.id === "b1")) S.biz.won.unshift({ id: "b1", title: r.title, price: n.terms }); if (S.portal === "business") toast("Job won"); }
function analyse(name, sample) {
  const f = S.find; f.file = name; f.busy = true; f.sample = sample; render();
  later(() => { f.busy = false; f.ex = JSON.parse(JSON.stringify(SAMPLE[f.cat])); f.step = 3; if (!sample) toast("Showing a sample extraction for you to edit"); }, 2100);
}

// ───────────────────────── events ─────────────────────────
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "backdrop" && e.target !== el) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset.v, e);
});
document.addEventListener("change", (e) => { if (e.target.id === "file" && e.target.files[0]) analyse(e.target.files[0].name, false); });
document.addEventListener("dragover", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (e) => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file) analyse(file.name, false); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.ui.modal) A.close(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== route) { route = h; if (h.startsWith("biz")) S.portal = "business"; render(); } });
const h0 = location.hash.slice(1); if (VIEWS[h0] && !["deal"].includes(h0)) { route = h0; if (h0.startsWith("biz")) S.portal = "business"; }
render();
})();
</script>
